# SPDX-License-Identifier: Apache-2.0
#
# The Dockerfile pins its node bases by digest (zitadel-login#4). Dependabot
# moves those pins when a newer node:24 / node:24-alpine index is published,
# so the pin stays reproducible and current. Actions are pinned to commit
# SHAs the same way (zitadel-login#3).
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

    groups:
      docker-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
      actions-deps:
        patterns:
          - '*'
        exclude-patterns:
          - github/codeql-action*
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
