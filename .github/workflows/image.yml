name: image

# Builds + pushes ghcr.io/zeroroot-ai/zitadel-login to GHCR via the org
# reusable image-build workflow (deploy#888).
#
# UPSTREAM_REF is the only copy of the upstream ZITADEL version
# (zitadel-login#7, zeroroot-ai/.github#20). The `resolve` job reads it and
# every later job consumes its outputs: the build args, and the `v<upstream>`
# image tag that every push to `main` publishes next to `sha-<short>`. No git
# tag is involved; the chart pins `v<upstream>@sha256:<digest>` and
# re-resolves the digest at chart publish.
#
# The build fails when the NEXT_PUBLIC_LANDING_URL Actions variable is unset,
# before the 10-minute build starts. An empty value used to ship an unbranded
# image.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: resolve UPSTREAM_REF
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      repo: ${{ steps.ref.outputs.repo }}
      tag: ${{ steps.ref.outputs.tag }}
      commit: ${{ steps.ref.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the UPSTREAM_REF reader and the patch check
        run: |
          bash scripts/upstream-ref.sh --selftest
          bash scripts/patch-check.sh --selftest
      - name: Read UPSTREAM_REF
        id: ref
        run: bash scripts/upstream-ref.sh --github-output
      - name: Require the landing-URL variable
        env:
          NEXT_PUBLIC_LANDING_URL: ${{ vars.NEXT_PUBLIC_LANDING_URL }}
        run: |
          if [ -z "${NEXT_PUBLIC_LANDING_URL}" ]; then
            echo "::error::The NEXT_PUBLIC_LANDING_URL Actions variable is unset on this repo. The image would ship unbranded. Set it with: gh variable set NEXT_PUBLIC_LANDING_URL -R ${GITHUB_REPOSITORY}"
            exit 1
          fi

  # The patch set must apply to the pinned upstream tag. Runs on every PR, so a
  # bump of UPSTREAM_REF whose patch no longer applies goes red here, not only
  # inside the image build.
  patch-check:
    name: patch-check
    if: github.event_name == 'pull_request'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/patch-check.sh

  build:
    needs: resolve
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@c06ea08fddecc754ac6faf06f9fc0511d13cb955 # v0.5.2
    permissions:
      # The reusable build declares what it needs and narrows to
      # contents: read itself. A write-scoped token on a job that clones
      # upstream and runs its install scripts, on every pull request, was
      # the finding; nothing here creates a release, pushes or tags.
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: zitadel-login
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/zitadel-login
      # Ref-derived tags are not used; the version tag comes from UPSTREAM_REF.
      # The input is required by the reusable workflow, so it names a pattern
      # no ref of this repo matches.
      tag_pattern: ^(never-matches)$
      version_tag: ${{ needs.resolve.outputs.tag }}
      build_args: |
        UPSTREAM_REPO=${{ needs.resolve.outputs.repo }}
        UPSTREAM_TAG=${{ needs.resolve.outputs.tag }}
        UPSTREAM_COMMIT=${{ needs.resolve.outputs.commit }}
        NEXT_PUBLIC_LANDING_URL=${{ vars.NEXT_PUBLIC_LANDING_URL }}

  # Version fan-out (zeroroot-ai/.github#20, slice #24). After every publish
  # from `main` the org reusable reads the `zitadel` link in
  # version-links.yaml and opens or updates ONE charts PR that moves
  # `zitadel.image.tag` and the login pin to the tag this run published. The
  # PR goes through the charts merge gate and sign-off; auto-merge is never
  # armed. A failure here is loud on purpose (ADR-0013). The two App secrets
  # live on this repo, the same way sdk holds them for its fan-out.
  fanout:
    needs: build
    # A workflow_dispatch on main re-runs the fan-out by hand, for example
    # after the App secret was missing on the first push (run 34139336828).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: zeroroot-ai/.github/.github/workflows/reusable-version-fanout.yml@1366fb5a29590e522bf5a74308f55bb39a4edb56 # v0.5.1
    permissions:
      contents: read
      packages: read
    with:
      link: zitadel
    secrets:
      app-id: ${{ secrets.SDK_FANOUT_APP_ID }}
      app-private-key: ${{ secrets.SDK_FANOUT_APP_PRIVATE_KEY }}

  # Iron-Bank-aligned post-build assertions (reusable-container-hardening.yml).
  # forbid_shell is false: the runtime is node:24-alpine and the upstream
  # entrypoint is a /bin/sh script (entrypoint.sh), so a shell is required.
  # The whole exposure argument of this image rests on one Next.js config
  # key (images.unoptimized, patches/0002) whose effect on the standalone
  # server's route table the repo only asserted. This job starts the image
  # it just built and proves the optimizer is not there: /_next/image must
  # not answer with an image. It runs on the pushed digest, so like the
  # hardening job it cannot run on a pull request (nothing is pushed there).
  image-route-gone:
    name: the image optimizer route is gone
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Prove /_next/image is not served
        env:
          IMAGE: ghcr.io/zeroroot-ai/zitadel-login@${{ needs.build.outputs.digest }}
        run: bash scripts/check-image-route-gone.sh "$IMAGE"

  hardening:
    needs: build
    if: github.event_name != 'pull_request'
    uses: zeroroot-ai/.github/.github/workflows/reusable-container-hardening.yml@1366fb5a29590e522bf5a74308f55bb39a4edb56 # v0.5.1
    permissions:
      contents: read
      packages: read
    with:
      image_ref: ghcr.io/zeroroot-ai/zitadel-login@${{ needs.build.outputs.digest }}
      size_budget_mb: 800
      forbid_shell: false
